version: '2.2'

services:
  jstats:
    image: node:20
    container_name: ${JSTATS_CONTAINER_NAME:-jstats}
    environment:
      API_KEY: ${API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JIRA_API_TOKEN_FILE: ${JIRA_API_TOKEN_FILE:-/run/secrets/jira_api_token}
    command: >
      bash -c '
        cd /app
        npm install
        node app.js
      '
    working_dir: /usr/share/elasticsearch
    volumes:
      - certs:/certs
      - '.:/app'
      - "${JIRA_API_TOKEN_HOST_PATH:-/dev/null}:${JIRA_API_TOKEN_FILE:-/run/secrets/jira_api_token}:ro"
    networks:
      - elastic

volumes:
  certs:
    driver: local

networks:
  elastic:
    driver: bridge
