version: '2.2'

services:
  jstats:
    image: node:20
    container_name: jstats
    environment:
      GITHUB_API_KEY_FILE: ${GITHUB_API_KEY_FILE:-/run/secrets/github_api_key}
      JIRA_API_TOKEN_FILE: ${JIRA_API_TOKEN_FILE:-/run/secrets/jira_api_token}
    command: >
      bash -c '
        cd /app
        npm install
        node app.js
      '
    working_dir: /usr/share/elasticsearch
    volumes:
      - certs:/certs
      - '.:/app'
      - "${GITHUB_API_KEY_HOST_PATH:-/dev/null}:${GITHUB_API_KEY_FILE:-/run/secrets/github_api_key}:ro"
      - "${JIRA_API_TOKEN_HOST_PATH:-/dev/null}:${JIRA_API_TOKEN_FILE:-/run/secrets/jira_api_token}:ro"
    networks:
      - elastic

volumes:
  certs:
    driver: local

networks:
  elastic:
    driver: bridge
